name: Nightly listings update

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update listings
        run: node scripts/update-listings.mjs

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name "scholarship-hub-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/scholarships.json
            git commit -m "chore: nightly listings update $(date -u +%F)"
            git push
          else
            echo "No changes"
          fi
