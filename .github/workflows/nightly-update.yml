name: Manual non-destructive discovery
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write pending candidates to the configured isolated database
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: scholarship-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    environment: ingestion-preview
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate discovery code
        run: node --test scripts/completion.test.mjs
      - name: Plan without network or database access
        if: ${{ !inputs.apply }}
        run: node scripts/collect-opportunities.mjs --plan
      - name: Collect pending candidates
        if: ${{ inputs.apply }}
        env:
          DATABASE_INGEST_URL: ${{ secrets.DATABASE_INGEST_URL }}
        run: node scripts/collect-opportunities.mjs --apply
