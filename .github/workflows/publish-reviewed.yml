name: Daily public scholarship updates
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-reviewed.yml'
      - 'scripts/update-listings.mjs'
      - 'scripts/daily-update.test.mjs'
      - 'scripts/sources.json'
      - 'data/reviewed-publications.json'
permissions:
  contents: write
concurrency:
  group: publish-reviewed-scholarships
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test append-only discovery
        run: node --test scripts/daily-update.test.mjs
      - name: Publish reviewed queue
        run: node scripts/publish-reviewed.mjs
      - name: Collect public source-labelled discoveries
        run: node scripts/update-listings.mjs
      - name: Commit new public listings
        run: |
          if git diff --quiet -- data/scholarships.json; then
            echo 'No new listings; catalog unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name scholarship-hub-bot
          git config user.email actions@users.noreply.github.com
          git add -- data/scholarships.json
          git commit -m "chore: daily source discoveries $(date -u +%F)"
          git push origin HEAD:main
