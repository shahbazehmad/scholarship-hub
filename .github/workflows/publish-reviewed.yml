name: Publish reviewed scholarships
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-reviewed-scholarships
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publish-reviewed.mjs
      - run: |
          if git diff --quiet -- data/scholarships.json; then exit 0; fi
          git config user.name scholarship-hub-bot
          git config user.email actions@users.noreply.github.com
          git add -- data/scholarships.json
          git commit -m 'Publish reviewed scholarships'
          git push origin HEAD:main
